# Deploy FastAPI backend + PDF service to EC2 (Docker Compose + Nginx on host).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_SSH_HOST          e.g. 3.139.146.5
#   AWS_SSH_USER          e.g. ec2-user
#   AWS_SSH_PRIVATE_KEY   full PEM (-----BEGIN ... PRIVATE KEY-----)
#
# The runner checks out this repo (works for private repos via default GITHUB_TOKEN),
# copies backend/ + docker-compose.yml over SSH, then runs docker compose on the instance.
# The server must already have .env.prod, Docker, and project path /home/ec2-user/cv_lator
# (edit the paths below if yours differ).

name: Deploy backend (AWS)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend-aws.yml"

concurrency:
  group: deploy-backend-aws
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy backend + compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "backend/,docker-compose.yml"
          target: "/home/ec2-user/cv_lator"
          strip_components: 0

      - name: Docker compose up
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/ec2-user/cv_lator
            sudo docker compose --env-file .env.prod up -d --build pdf-service backend
