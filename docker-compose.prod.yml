# Production stack: nginx on 80/443, frontend (SPA + /api proxy), backend. Dev stays on 3000/8000.
# Run: docker compose -f docker-compose.prod.yml up -d
# App: http://localhost (and https://localhost if ssl/ certs are set; see ssl/README).
name: cvlator-prod
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    ports: []   # no host exposure; reached via frontend -> backend internally
    volumes:
      - prod_data:/app/data
      - prod_uploads:/app/uploads
    restart: unless-stopped
    command: python run_production.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    ports: []   # no host exposure; reached via nginx only (80/443)
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  prod_data:
  prod_uploads:
