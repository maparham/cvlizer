# Development stack: frontend 3000, backend 8000, hot reload. Prod uses docker-compose.prod.yml on 80/443.
# Run: docker compose up
name: cvlator-dev
version: '3.8'

services:
  backend:
    build: ./backend
    env_file: .env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
